openapi: 3.0.4
info:
  title: Phone Number Validator
  description: >-
    Phone Number Validator checks a phone number and returns whether it is
    valid, its line type, country, area and time zone, and the carrier its
    mobile range was allocated to. It flags disposable and VoIP numbers and
    outputs E.164, international, national and RFC3966 formats.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/phonenumbervalidator:
    get:
      summary: Phone Number Validator
      description: Validate a phone number
      operationId: phonenumbervalidator
      parameters:
        - name: number
          in: query
          schema:
            type: string
          required: true
          description: The phone number to validate
          example: 816-555-1017
        - name: country
          in: query
          schema:
            type: string
          required: false
          description: >-
            The two-letter country code of the phone number (e.g., us, uk).
            Optional when the number is in international format starting with +
          example: us
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: US
                  detectedCountry: US
                  countryName: United States
                  countrycode: 1
                  numberNational: 8165551017
                  extension: null
                  isValid: true
                  isMobile: true
                  isVoip: false
                  isDisposable: false
                  type: fixed_line_or_mobile
                  isValidNumber: true
                  nationalSignificantNumber: '8165551017'
                  location: Missouri
                  carrier: null
                  timezones:
                    - America/Chicago
                  formatted:
                    international: +1 816-555-1017
                    national: (816) 555-1017
                    rfc: tel:+1-816-555-1017
                    e164: '+18165551017'
                  riskScore: 0
                  riskLevel: low
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
